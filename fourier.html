<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osciloscopio: Serie de Fourier - Onda Cuadrada</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            margin-bottom: 20px;
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 900px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        canvas {
            background-color: #000;
            border: 2px solid #333;
            border-radius: 5px;
            box-shadow: inset 0 0 20px rgba(0, 255, 0, 0.1);
            width: 100%;
            height: 400px;
        }
        .controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #b0bec5;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .legend {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .legend span {
            display: flex;
            align-items: center;
            font-weight: bold;
        }
        .legend span::before {
            content: '';
            display: inline-block;
            width: 15px;
            height: 15px;
            margin-right: 8px;
            border-radius: 50%;
        }
        .leg-square::before { background-color: #00e5ff; }
        .leg-sine::before { background-color: #ff3d00; }
    </style>
</head>
<body>

    <h1>Análisis de Fourier</h1>
    
    <div class="container">
        <canvas id="oscilloscope"></canvas>
        
        <div class="legend">
            <span class="leg-square">Onda Cuadrada (Síntesis)</span>
            <span class="leg-sine">Onda Sinusoidal (Fundamental)</span>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="harmonics">Armónicos (n): <span id="harmonics-val">5</span></label>
                <input type="range" id="harmonics" min="1" max="50" step="2" value="5">
            </div>
            <div class="control-group">
                <label for="frequency">Frecuencia (Hz): <span id="freq-val">1</span></label>
                <input type="range" id="frequency" min="0.1" max="5" step="0.1" value="1">
            </div>
            <div class="control-group">
                <label for="amplitude">Amplitud (A): <span id="amp-val">100</span></label>
                <input type="range" id="amplitude" min="10" max="200" step="10" value="100">
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('oscilloscope');
        const ctx = canvas.getContext('2d');
        
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;

        const harmonicsInput = document.getElementById('harmonics');
        const freqInput = document.getElementById('frequency');
        const ampInput = document.getElementById('amplitude');
        
        const harmonicsVal = document.getElementById('harmonics-val');
        const freqVal = document.getElementById('freq-val');
        const ampVal = document.getElementById('amp-val');

        let time = 0;

        function drawGrid() {
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.2)';
            ctx.lineWidth = 1;
            
            for(let i = 0; i <= canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for(let i = 0; i <= canvas.height; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            ctx.strokeStyle = 'rgba(0, 255, 0, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
        }

        function drawWaves() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();

            const n_max = parseInt(harmonicsInput.value);
            const freq = parseFloat(freqInput.value);
            const A = parseFloat(ampInput.value);
            const centerY = canvas.height / 2;

            ctx.beginPath();
            ctx.strokeStyle = '#ff3d00'; 
            ctx.lineWidth = 2;
            for (let x = 0; x < canvas.width; x++) {
                let t = x * 0.01 - time;
                let y_sine = A * Math.sin(freq * t);
                
                if (x === 0) ctx.moveTo(x, centerY - y_sine);
                else ctx.lineTo(x, centerY - y_sine);
            }
            ctx.stroke();

            ctx.beginPath();
            ctx.strokeStyle = '#00e5ff'; 
            ctx.lineWidth = 3;
            for (let x = 0; x < canvas.width; x++) {
                let t = x * 0.01 - time;
                let y_square = 0;
                
                for (let n = 1; n <= n_max; n += 2) {
                    y_square += (4 * A / (n * Math.PI)) * Math.sin(n * freq * t);
                }

                if (x === 0) ctx.moveTo(x, centerY - y_square);
                else ctx.lineTo(x, centerY - y_square);
            }
            ctx.stroke();

            time += 0.05;
            requestAnimationFrame(drawWaves);
        }

        harmonicsInput.addEventListener('input', () => harmonicsVal.innerText = harmonicsInput.value);
        freqInput.addEventListener('input', () => freqVal.innerText = freqInput.value);
        ampInput.addEventListener('input', () => ampVal.innerText = ampInput.value);

        drawWaves();
    </script>
</body>
</html>
