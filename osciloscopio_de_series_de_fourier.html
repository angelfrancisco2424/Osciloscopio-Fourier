<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osciloscopio de Series de Fourier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos base para asegurar que el canvas se comporte bien */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
        }
        /* Custom range slider styling for a better dark theme look */
        input[type=range] {
            accent-color: #00FFFF;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

    <div class="w-full max-w-5xl space-y-6">
        <!-- Header -->
        <header class="text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-cyan-400 mb-2">Simulador de Series de Fourier</h1>
            <p class="text-gray-400 text-sm md:text-base">Análisis del fenómeno de Gibbs y aproximación de ondas</p>
        </header>

        <!-- Controles -->
        <div class="bg-gray-800 p-4 md:p-6 rounded-xl shadow-lg flex flex-col md:flex-row gap-6 items-center justify-between border border-gray-700">
            
            <!-- Selector de Onda -->
            <div class="flex flex-col w-full md:w-1/3">
                <label for="waveType" class="text-sm font-semibold text-gray-300 mb-2">Tipo de Onda:</label>
                <select id="waveType" class="bg-gray-900 border border-gray-600 text-white text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 block w-full p-2.5 outline-none transition-colors">
                    <option value="square">Onda Cuadrada</option>
                    <option value="sawtooth">Onda Diente de Sierra</option>
                    <option value="triangular">Onda Triangular</option>
                </select>
            </div>

            <!-- Deslizador de Armónicos -->
            <div class="flex flex-col w-full md:w-2/3">
                <div class="flex justify-between mb-2">
                    <label for="harmonics" class="text-sm font-semibold text-gray-300">Número de Armónicos (N):</label>
                    <span id="harmonicsValue" class="text-sm font-bold text-cyan-400 bg-gray-900 px-2 py-1 rounded border border-gray-700">10</span>
                </div>
                <input id="harmonics" type="range" min="1" max="50" value="10" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
            </div>
            
        </div>

        <!-- Contenedor del Osciloscopio (Canvas) -->
        <div class="w-full aspect-video md:aspect-[21/9] bg-black rounded-xl p-1 border-2 border-gray-700 relative">
            <canvas id="oscilloscope"></canvas>
        </div>
        
        <!-- Explicación de la ecuación actual -->
        <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 text-center text-gray-400 text-sm font-mono" id="equationDisplay">
            <!-- Se llena con JS -->
        </div>
    </div>

    <script>
        // Elementos del DOM
        const canvas = document.getElementById('oscilloscope');
        const ctx = canvas.getContext('2d');
        const waveTypeSelect = document.getElementById('waveType');
        const harmonicsSlider = document.getElementById('harmonics');
        const harmonicsValueDisplay = document.getElementById('harmonicsValue');
        const equationDisplay = document.getElementById('equationDisplay');

        // Variables de animación
        let t = 0;
        const speed = 0.05; // Velocidad de desplazamiento horizontal
        let animationId;

        // Ecuaciones en texto para mostrar en la interfaz
        const equations = {
            square: "f(x,t) = Σ [ 4 / ((2k-1)π) * sin((2k-1)x - t) ]",
            sawtooth: "f(x,t) = 0.5 - (1/π) * Σ [ sin(kx - t) / k ]",
            triangular: "f(x,t) = Σ [ 8 / (π²(2k-1)²) * cos((2k-1)x - t) ]"
        };

        // Ajustar el tamaño del canvas
        function resizeCanvas() {
            // Se le da el tamaño real en píxeles basándose en su contenedor
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }

        // Dibujar la cuadrícula verde del osciloscopio
        function drawGrid() {
            ctx.strokeStyle = '#003300'; // Verde oscuro
            ctx.lineWidth = 1;
            ctx.beginPath();
            
            const gridSize = 40;
            
            // Líneas verticales
            for (let x = 0; x <= canvas.width; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
            }
            
            // Líneas horizontales
            for (let y = 0; y <= canvas.height; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();

            // Líneas centrales más brillantes
            ctx.strokeStyle = '#005500';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
        }

        // Función matemática que aplica las ecuaciones de Fourier mediante un ciclo FOR
        function calculateFourier(x, t, type, N) {
            let sum = 0;

            if (type === 'square') {
                // Onda Cuadrada: sum from k=1 to N of (4/((2k-1)*PI) * sin((2k-1)*x - t))
                for (let k = 1; k <= N; k++) {
                    let n = (2 * k) - 1; // Solo armónicos impares
                    sum += (4 / (n * Math.PI)) * Math.sin(n * x - t);
                }
                return sum;

            } else if (type === 'sawtooth') {
                // Onda Diente de Sierra: 0.5 - (1/PI)*sum from k=1 to N of sin(k*x - t)/k
                for (let k = 1; k <= N; k++) {
                    sum += Math.sin(k * x - t) / k;
                }
                return 0.5 - (1 / Math.PI) * sum;

            } else if (type === 'triangular') {
                // Onda Triangular: sum from k=1 to N of (8/(PI^2 * (2k-1)^2) * cos((2k-1)*x - t))
                for (let k = 1; k <= N; k++) {
                    let n = (2 * k) - 1; // Solo armónicos impares
                    sum += (8 / (Math.pow(Math.PI, 2) * Math.pow(n, 2))) * Math.cos(n * x - t);
                }
                return sum;
            }
            return 0;
        }

        // Ciclo principal de animación
        function animate() {
            // 1. Limpiar el canvas con fondo negro
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 2. Dibujar cuadrícula
            drawGrid();

            // 3. Obtener valores actuales de la UI
            const type = waveTypeSelect.value;
            const N = parseInt(harmonicsSlider.value);
            
            // 4. Configurar el pincel para la onda (Cyan, grosor 3)
            ctx.strokeStyle = '#00FFFF';
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            ctx.beginPath();

            // Cuántos ciclos completos (periodos) queremos ver en pantalla
            const periods = 3; 
            const mathWidth = periods * 2 * Math.PI; // Rango de X en radianes

            // 5. Ciclo para dibujar punto por punto en el canvas
            for (let px = 0; px < canvas.width; px++) {
                
                // Convertir coordenada X del pixel a X matemático
                let mathX = (px / canvas.width) * mathWidth;
                
                // Calcular Y matemático acumulando los armónicos
                let mathY = calculateFourier(mathX, t, type, N);

                // Escalar Y matemático a coordenadas del Canvas
                // Para diente de sierra, la función va de 0 a 1, por lo que restamos 0.5 para centrarla en la pantalla.
                // Para cuadrada y triangular oscilan aproximadamente entre -1 y 1.
                let centerOffset = (type === 'sawtooth') ? 0.5 : 0;
                
                // La amplitud visual es aproximadamente 1/3 de la altura de la pantalla
                let amplitudeScale = canvas.height / 3; 
                
                let cy = (canvas.height / 2) - ((mathY - centerOffset) * amplitudeScale);

                // Unir puntos
                if (px === 0) {
                    ctx.moveTo(px, cy);
                } else {
                    ctx.lineTo(px, cy);
                }
            }
            
            // Trazar la línea final
            ctx.stroke();

            // Avanzar el tiempo para la animación horizontal
            t += speed;

            // Solicitar el siguiente frame
            animationId = requestAnimationFrame(animate);
        }

        // Listeners para interactividad
        window.addEventListener('resize', resizeCanvas);
        
        harmonicsSlider.addEventListener('input', (e) => {
            harmonicsValueDisplay.innerText = e.target.value;
        });

        waveTypeSelect.addEventListener('change', (e) => {
            equationDisplay.innerText = equations[e.target.value];
        });

        // Inicialización
        window.onload = () => {
            resizeCanvas();
            equationDisplay.innerText = equations[waveTypeSelect.value];
            animate(); // Iniciar el loop de animación
        };

    </script>
</body>
</html>
